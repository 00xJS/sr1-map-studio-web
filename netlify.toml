[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/py/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The Python runtime: large, and only changes with the pyodide version in package.json.
[[headers]]
  for = "/pyodide/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
