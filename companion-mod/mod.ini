[mod]
name = SR1 Map Studio Companion
author = 00xJS
version = 0.1
description = For maps made with SR1 Map Studio. Custom textures get their real surface (metal, wood, glass, grass ...) for footsteps and bullet impacts instead of concrete. F7 in a multiplayer match reloads the map, and installing the map again from SR1 Map Studio reloads it by itself, so edits show up in seconds. Each match is recorded (falls, stuck spots, End marks) for SR1 Map Studio to show on the map. Private play only.

[settings]
; ---- Surfaces ----
; Give custom map textures the surface their name asks for (the two letters before the extension: _me metal, _wo wood ...).
surface_fix = true

; ---- Reloading the map ----
; Key that reloads the multiplayer map you're playing ("" = none). Letters, digits or F1-F12.
; (F5 is the SR Tweak Menu's; on a Mac keyboard hold Fn for the F-keys.)
reload_key = F7
; Reload by itself when SR1 Map Studio installs the map you're playing again.
auto_reload = true
; How often to look for a new install, in seconds.
poll_seconds = 1.0
; The map's folder in dist/maps, if the mod can't find it by itself (for example "Studio Test"). "" = find it.
watch_folder = ""
; Show "Map reloaded" on the screen after a reload.
hud_messages = false

; ---- Playtest log ----
; Record each match to playtest/<map>-<date>-<time>.jsonl in this folder: where you went, falls, stuck spots, camera pushes, End marks.
playtest_log = true
; How many playtest logs to keep; older ones are deleted when a new one starts (0 = keep all).
playtest_keep = 20

; Write every step (surface fixes, reloads, the folder watched) to mods/wml.log.
debug = false
